plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sniper.tower'
    compileSdk 34
    defaultConfig {
        applicationId "com.sniper.tower"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'SniperTower2026'
            keyAlias 'sniperkey'
            keyPassword 'SniperTower2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
